<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo PWA Offline</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 20px; max-width: 400px; margin: auto; }
    h1 { color: #4CAF50; text-align: center; }
    input, button { padding: 10px; font-size: 16px; }
    input { width: 70%; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: white; padding: 10px; margin-top: 8px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>📝 Todo Offline</h1>
  <input id="taskInput" placeholder="Tulis tugas...">
  <button onclick="addTask()">Tambah</button>
  <ul id="taskList"></ul>

  <script src="app.js"></script>
</body>
</html>
