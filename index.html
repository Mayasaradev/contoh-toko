<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Asa Sipaling Asa - Toko Sembako</title>
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font: 'Inter', sans-serif;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s ease;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.14);
        }

        /* Light theme (blue) */
        [data-theme="light"] {
            --bg-primary: #f0f7ff;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f2f8ff;
            --bg-footer: #e8f0fe;
            --text-primary: #0b1a33;
            --text-secondary: #2c3e66;
            --text-muted: #5a6f8c;
            --border: #d6e4f5;
            --accent: #1a6bff;
            --accent-hover: #0f5ae0;
            --accent-light: #e8f0ff;
            --accent-glow: rgba(26, 107, 255, 0.15);
            --badge-bg: #1a6bff;
            --badge-text: #ffffff;
            --whatsapp: #25d366;
            --whatsapp-hover: #1da851;
            --shadow-card: 0 4px 20px rgba(26, 107, 255, 0.08);
            --shadow-card-hover: 0 8px 32px rgba(26, 107, 255, 0.16);
            --toggle-bg: #d6e4f5;
            --toggle-dot: #1a6bff;
            --testimonial-bg: #f5faff;
            --scrollbar: #c5d8f0;
        }

        /* Dark theme (purple) */
        [data-theme="dark"] {
            --bg-primary: #120b24;
            --bg-secondary: #1c1433;
            --bg-card: #251d3a;
            --bg-input: #1c1433;
            --bg-footer: #0f0a1e;
            --text-primary: #f0eaff;
            --text-secondary: #d4ccf0;
            --text-muted: #9a8ab8;
            --border: #3d2f5a;
            --accent: #9b7bff;
            --accent-hover: #b08eff;
            --accent-light: #2d1f4a;
            --accent-glow: rgba(155, 123, 255, 0.2);
            --badge-bg: #9b7bff;
            --badge-text: #120b24;
            --whatsapp: #25d366;
            --whatsapp-hover: #1da851;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-card-hover: 0 8px 32px rgba(155, 123, 255, 0.2);
            --toggle-bg: #3d2f5a;
            --toggle-dot: #9b7bff;
            --testimonial-bg: #1c1433;
            --scrollbar: #3d2f5a;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar);
            border-radius: 10px;
        }

        /* ===== BASE ===== */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            line-height: 1.6;
            padding: 0 0 80px 0;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 18px;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(var(--bg-secondary-rgb, 255, 255, 255), 0.85);
            transition: background var(--transition), border var(--transition);
        }

        [data-theme="light"] .header {
            --bg-secondary-rgb: 255, 255, 255;
        }
        [data-theme="dark"] .header {
            --bg-secondary-rgb: 28, 20, 51;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .logo span {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Theme toggle */
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--accent-light);
            color: var(--accent);
            transform: scale(1.05);
        }

        /* Cart button */
        .cart-btn {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .cart-btn:hover {
            transform: scale(1.05);
            background: var(--accent-hover);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff4757;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-secondary);
            transition: all var(--transition);
        }

        .cart-badge.hidden {
            transform: scale(0);
            opacity: 0;
        }

        /* ===== HERO ===== */
        .hero {
            padding: 28px 0 18px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 340px;
            margin: 0 auto 6px;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .hero-tags span {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ===== PRODUCTS ===== */
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent);
            font-size: 1.1rem;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--border);
            transition: all var(--transition);
            box-shadow: var(--shadow-card);
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .product-card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .product-icon {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-sm);
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--accent);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .product-info .desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .product-info .price {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .product-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
            white-space: nowrap;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: scale(1.03);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-primary i {
            font-size: 0.8rem;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-input);
            border-radius: 30px;
            padding: 2px 4px;
            border: 1px solid var(--border);
        }

        .qty-control button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .qty-control button:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .qty-control span {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .product-total {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ===== CART PANEL ===== */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
        }

        .cart-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .cart-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85vh;
            background: var(--bg-secondary);
            border-radius: var(--radius) var(--radius) 0 0;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.2);
            padding: 20px 18px 24px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
        }

        .cart-panel.open {
            transform: translateY(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .cart-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-header h2 i {
            color: var(--accent);
        }

        .cart-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-close:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .cart-empty {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }

        .cart-empty i {
            font-size: 2.8rem;
            color: var(--border);
            margin-bottom: 12px;
        }

        .cart-empty p {
            font-size: 0.95rem;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .cart-item .ci-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--accent);
            flex-shrink: 0;
        }

        .cart-item .ci-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item .ci-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cart-item .ci-info .ci-price {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cart-item .ci-qty {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-item .ci-qty button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            font-weight: 600;
        }

        .cart-item .ci-qty button:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .cart-item .ci-qty span {
            min-width: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-item .ci-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: color var(--transition);
            padding: 4px;
        }

        .cart-item .ci-remove:hover {
            color: #ff4757;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 4px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .cart-total .total-price {
            color: var(--accent);
        }

        .btn-checkout {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font);
        }

        .btn-checkout:hover {
            background: var(--accent-hover);
            transform: scale(1.01);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-checkout i {
            font-size: 1rem;
        }

        .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== TESTIMONIALS ===== */
        .testimonials {
            margin: 32px 0 20px;
        }

        .testimonials-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .testimonial-card {
            background: var(--testimonial-bg);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--border);
            transition: all var(--transition);
        }

        .testimonial-card:hover {
            border-color: var(--accent);
        }

        .testimonial-card .stars {
            color: #f9b93b;
